<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Document Register</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="chart-card">

    <h3>Document Status Overview</h3>

    <canvas id="statusChart"></canvas>

</div>

<header>
    <h2 id="projectTitle">📄 projectNames</h2>

    <a href="projects.html">⬅ Back to Projects</a>
</header>

<div class="dashboard">

    <div class="card">
        <h3>Total Documents</h3>
        <h1 id="totalDocs">0</h1>
    </div>

    <div class="card approved">
        <h3>Approved</h3>
        <h1 id="approvedDocs">0</h1>
    </div>

    <div class="card approved-as-corrected">
        <h3>Approved As Corrected</h3>
        <h1 id="approvedAsCorrectedDocs">0</h1>
    </div>

    <div class="card reviseResubmit">
        <h3>Revise & Resubmit</h3>
        <h1 id="reviseResubmitDocs">0</h1>
    </div>
    
    <div class="card submitted">
        <h3>Submitted</h3>
        <h1 id="submittedDocs">0</h1>
    </div>

    <div class="card draft">
        <h3>Draft</h3>
        <h1 id="draftDocs">0</h1>
    </div>

    <div class="card cancelled">
        <h3>Cancelled</h3>
        <h1 id="cancelledDocs">0</h1>
    </div>

    <div class="card superseded">
        <h3>Superseded</h3>
        <h1 id="supersededDocs">0</h1>
    </div>

    <div class="card overdue">
    <h3>Overdue</h3>
    <h1 id="overdueDocs">0</h1>
</div>

</div>

<div class="container">

    <div class="toolbar">

        <input
            type="text"
            id="searchBox"
            placeholder="Search documents...">

        <select id="statusFilter">

            <option value="">All Status</option>
            <option value="Approved">Approved</option>
            <option value="Approved As Corrected">Approved As Corrected</option>
            <option value="Revise & Resubmit">Revise & Resubmit</option>
            <option value="Submitted">Submitted</option>
            <option value="Draft">Draft</option>
            <option value="cancelled">Cancelled</option>
            <option value="Superseded">Superseded</option>
            <option value="Overdue">Overdue</option>

        </select>

        <select id="categoryFilter">

    <option value="">All Categories</option>
    <option value="RFA">RFA</option>
    <option value="RFI">RFI</option>
    <option value="MAR">MAR</option>
    <option value="CVI">CVI</option>       
    <option value="Safety">Safety</option>
    <option value="Letter">Letter</option>
         </select>

         <select id="tradeFilter">
    <option value="">All Trades</option>
    <option value="Architectural">Architectural</option>
    <option value="Civil">Civil</option>
    <option value="Structural">Structural</option>
    <option value="Electrical">Electrical</option>
    <option value="Mechanical">Mechanical</option>
    <option value="Plumbing">Plumbing</option>
    <option value="Safety">Safety</option>
</select>

<select id="sortFilter">
    <option value="">Sort By</option>
    <option value="date-desc">Newest Date</option>
    <option value="date-asc">Oldest Date</option>
    <option value="doc-asc">Document No. (A-Z)</option>
    <option value="doc-desc">Document No. (Z-A)</option>
    <option value="title-asc">Title (A-Z)</option>
    <option value="title-desc">Title (Z-A)</option>
    
</select>

    </div>

    <p id="recordCount"></p>

    <div class="table-container">

    <table id="docTable">

        <thead>

            <tr>
                <th>Document No.</th>
                <th>Category</th>
                <th>Trade</th>
                <th>Title</th>
                <th>Revision</th>
                <th>Status</th>
                <th>Date</th>
                <th>File</th>
            </tr>

        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

</div> 
    
<script src="js/documents.js"></script>    
    
</body>
